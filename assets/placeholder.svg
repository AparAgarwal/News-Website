<svg width="800" height="450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="450" fill="url(#grad1)"/>
  
  <!-- Newspaper Icon -->
  <g transform="translate(350, 160)">
    <rect x="0" y="0" width="100" height="80" fill="none" stroke="#999" stroke-width="3" rx="4"/>
    <line x1="10" y1="15" x2="90" y2="15" stroke="#999" stroke-width="2"/>
    <line x1="10" y1="30" x2="50" y2="30" stroke="#bbb" stroke-width="2"/>
    <line x1="10" y1="40" x2="50" y2="40" stroke="#bbb" stroke-width="2"/>
    <line x1="10" y1="50" x2="50" y2="50" stroke="#bbb" stroke-width="2"/>
    <rect x="60" y="30" width="30" height="30" fill="#ccc" rx="2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="280" font-family="Arial, sans-serif" font-size="20" fill="#999" text-anchor="middle" font-weight="500">
    No Image Available
  </text>
  
  <!-- Decorative underline -->
  <line x1="315" y1="290" x2="485" y2="290" stroke="#bbb" stroke-width="1" opacity="0.5"/>
</svg>
